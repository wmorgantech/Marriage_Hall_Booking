version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: checknbook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: checknbook
    ports:
      - '5432:5432'
    volumes:
      - checknbook_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  checknbook_pgdata:
