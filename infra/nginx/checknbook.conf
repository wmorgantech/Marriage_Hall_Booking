# /etc/nginx/sites-available/checknbook
# Replace ${SUBDOMAIN} with your actual subdomain, e.g. checknbook.example.com
# Replace ${WEB_ROOT} with the absolute path to apps/web/dist on the server.
#
# After editing:
#   sudo ln -s /etc/nginx/sites-available/checknbook /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Certbot will rewrite this file to add the 443 listener + SSL cert paths.

server {
    listen 80;
    listen [::]:80;
    server_name ${SUBDOMAIN};

    # Static React build
    root ${WEB_ROOT};
    index index.html;

    # Reverse-proxy the API
    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health check passthrough
    location = /health {
        proxy_pass http://127.0.0.1:4000/health;
    }

    # Long-cache static assets produced by Vite (hashed filenames)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — every non-file route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic hardening
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options         "SAMEORIGIN" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    client_max_body_size 2M;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
